# Blueprint do Render: cria o serviço web e a base de dados Postgres (ambos no plano grátis).
services:
  - type: web
    name: hackathon-votacao
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: SECURE_COOKIE
        value: "1"
      # Os códigos não estão no repositório: carregue data/voters.csv como Secret File "voters.csv".
      - key: VOTERS_FILE
        value: /etc/secrets/voters.csv
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-votacao-db
          property: connectionString

databases:
  - name: hackathon-votacao-db
    plan: free
    region: frankfurt
